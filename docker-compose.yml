version: "3.9"

services:
  ashi-mcp:
    build: .
    container_name: ashi-mcp
    restart: unless-stopped
    ports:
      - "3030:3000"
    environment:
      - PORT=3000
      - ASHI_JEWELER_ID=CARTJA11720
      - ASHI_USERNAME=avalontester1@gmail.com
      - ASHI_PASSWORD=${ASHI_PASSWORD}
      - ASHI_JEWELSOFTID=
      - AUTH_KEY=${AUTH_KEY}
    networks:
      - mcp-network

  # Example: your app that calls Claude API + uses MCP
  # Uncomment and adapt when you add your app container
  # my-app:
  #   build: ../my-app
  #   environment:
  #     - MCP_SERVER_URL=http://ashi-mcp:3000/sse
  #     - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
  #   depends_on:
  #     - ashi-mcp
  #   networks:
  #     - mcp-network

networks:
  mcp-network:
    driver: bridge
